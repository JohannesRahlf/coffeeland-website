name: Optimize contributor images

# Phone photos are large (several MB, 4000 px wide, with GPS location in the metadata).
# After "Manage contributor branches" runs, this workflow looks at the images that each
# edits-<user> branch adds or changes in static/images/ and, where needed:
#   - scales them down to fit within 1600 x 1600 px
#   - recompresses them (JPEG/WebP quality 82)
#   - strips all metadata (including GPS location)
# and commits the result back to that branch with the same file names.
#
# Runs from main. Branch content is only ever treated as image data: no script from a
# branch is executed, symlinks are skipped, and formats are forced by file extension.
# The pull request scope check runs after this workflow (see pr-scope-check.yml).

on:
  workflow_run:
    workflows: ["Manage contributor branches"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install ImageMagick
        run: |
          if ! command -v convert >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          convert -version | head -1

      - name: Optimize images on contributor branches
        env:
          MAX_BYTES: "512000"
          MAX_DIM: "1600"
        run: |
          set -uo pipefail
          limits="-limit memory 512MiB -limit map 512MiB -limit disk 1GiB -limit time 60"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/edits-*'); do
            b=${ref#origin/}
            if [ "$(git rev-list --count origin/main.."$ref")" = "0" ]; then
              continue
            fi
            git checkout -q -B work "$ref"
            changed=0

            while IFS= read -r -d '' f; do
              [ -f "$f" ] && [ ! -L "$f" ] || continue
              lower=${f,,}
              case "$lower" in
                *.jpg|*.jpeg) fmt=jpeg ;;
                *.png)        fmt=png ;;
                *.webp)       fmt=webp ;;
                *)            continue ;;
              esac

              size=$(stat -c %s "$f")
              dims=$(identify $limits -format '%w %h' "$fmt:$f[0]" 2>/dev/null) || { echo "$b: $f unreadable, skipped"; continue; }
              read -r w h <<<"$dims"
              gps=$(identify $limits -format '%[EXIF:GPSLatitude]' "$fmt:$f[0]" 2>/dev/null || true)
              [ "$gps" = "unknown" ] && gps=""

              if [ "$size" -le "$MAX_BYTES" ] && [ "$w" -le "$MAX_DIM" ] && [ "$h" -le "$MAX_DIM" ] && [ -z "$gps" ]; then
                continue
              fi

              tmp="$f.optimized"
              case "$fmt" in
                jpeg) q="-sampling-factor 4:2:0 -quality 82 -interlace Plane" ;;
                webp) q="-quality 82" ;;
                png)  q="" ;;
              esac
              if convert $limits "$fmt:$f[0]" -auto-orient -resize "${MAX_DIM}x${MAX_DIM}>" -strip $q "$fmt:$tmp"; then
                new=$(stat -c %s "$tmp")
                if [ "$new" -lt "$size" ] || [ -n "$gps" ]; then
                  mv -f "$tmp" "$f"
                  echo "$b: $f ${size} -> ${new} bytes (${w}x${h}${gps:+, GPS removed})"
                  changed=1
                else
                  rm -f "$tmp"
                  echo "$b: $f not smaller after optimizing, left as is"
                fi
              else
                rm -f "$tmp"
                echo "$b: $f could not be converted, left as is"
              fi
            done < <(git diff -z --name-only --diff-filter=AM "origin/main...$ref" -- static/images/)

            if [ "$changed" = "1" ]; then
              git add -- static/images
              git commit -q -m "Optimize images (max ${MAX_DIM}px, recompressed, metadata removed)"
              git push -q origin "HEAD:refs/heads/$b" || echo "$b: push failed (branch changed meanwhile); will retry on the next run"
            fi
          done
