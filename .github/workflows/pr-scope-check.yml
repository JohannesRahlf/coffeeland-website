name: PR scope check

# Guardrail for contributor pull requests (branches named edits-<user>):
#   - only files under content/ and static/images/ may change
#   - files in static/images/ must be at most 500 KB
#   - at most 40 files per pull request
# Posts a commit status "scope-check" and a comment on the pull request.
#
# Runs from main (pull_request_target and workflow_run), checks out no pull request code,
# and also covers pull requests opened by the automatic workflow, which would not
# trigger pull_request_target themselves.
# This is a guardrail against mistakes and overeager tools, not a security boundary:
# the owner's review is still required.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: ["main"]
  workflow_run:
    workflows: ["Manage contributor branches"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: pr-scope-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_IMAGE_BYTES: "512000"
          MAX_FILES: "40"
        run: |
          set -euo pipefail
          marker='<!-- scope-check -->'

          gh pr list --repo "$REPO" --state open --base main --limit 100 \
            --json number,headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.number) \(.headRefName) \(.headRefOid)"' |
          while read -r n branch sha; do
            if [[ $branch != edits-* ]]; then
              gh api -X POST "repos/$REPO/statuses/$sha" -f state=success -f context=scope-check \
                -f description="Not a contributor branch" --silent
              continue
            fi

            problems=""
            count=0

            gh api "repos/$REPO/git/trees/$sha?recursive=1" \
              --jq '.tree[] | select(.type=="blob") | "\(.size)\t\(.path)"' > sizes.tsv

            while IFS=$'\t' read -r status file prev; do
              count=$((count + 1))
              if [[ ! $file =~ ^(content|static/images)/ ]]; then
                problems+="- \`$file\` is outside \`content/\` and \`static/images/\`"$'\n'
              fi
              if [ -n "$prev" ] && [[ ! $prev =~ ^(content|static/images)/ ]]; then
                problems+="- \`$prev\` (renamed/moved) is outside \`content/\` and \`static/images/\`"$'\n'
              fi
              if [ "$status" != "removed" ] && [[ $file == static/images/* ]]; then
                size=$(awk -F'\t' -v p="$file" '$2==p {print $1; exit}' sizes.tsv)
                if [ -n "$size" ] && [ "$size" -gt "$MAX_IMAGE_BYTES" ]; then
                  problems+="- \`$file\` is $((size / 1024)) KB (limit $((MAX_IMAGE_BYTES / 1024)) KB)"$'\n'
                fi
              fi
            done < <(gh api --paginate "repos/$REPO/pulls/$n/files?per_page=100" \
              --jq '.[] | "\(.status)\t\(.filename)\t\(.previous_filename // "")"')

            if [ "$count" -gt "$MAX_FILES" ]; then
              problems+="- $count files changed (limit $MAX_FILES)"$'\n'
            fi

            existing=$(gh api --paginate "repos/$REPO/issues/$n/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -1)

            if [ -n "$problems" ]; then
              gh api -X POST "repos/$REPO/statuses/$sha" -f state=failure -f context=scope-check \
                -f description="Outside allowed scope or too large; see PR comment" --silent
              body="$marker"$'\n'"**Scope check failed.** Contributor changes may only touch \`content/\` and \`static/images/\`, with images up to 500 KB and at most 40 files."$'\n\n'"$problems"$'\n'"Please remove or fix these changes. See CONTRIBUTING.md."
              if [ -n "$existing" ]; then
                gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" --silent
              else
                gh pr comment "$n" --repo "$REPO" --body "$body"
              fi
              echo "PR #$n ($branch): failed"
            else
              gh api -X POST "repos/$REPO/statuses/$sha" -f state=success -f context=scope-check \
                -f description="Only content and small images changed" --silent
              if [ -n "$existing" ]; then
                gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                  -f body="$marker"$'\n'"Scope check passed." --silent
              fi
              echo "PR #$n ($branch): ok"
            fi
          done
