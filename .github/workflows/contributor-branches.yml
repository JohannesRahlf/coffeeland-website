name: Manage contributor branches

# For each branch named edits-<github-user>:
#   - open a pull request into main when the branch has new commits
#   - reset the branch to main once its changes are merged (or it has nothing unique)
#
# Event-driven (no schedule): scheduled workflows are paused by GitHub after 60 days
# without repository activity, which would silently stop PRs from being created.
# pull_request_target runs the version of this file on main and checks out no code.

on:
  push:
    branches: ["edits-*", "main"]
  pull_request_target:
    types: [closed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributor-branches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull requests and reset merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)

          branches=$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | grep '^edits-' || true)

          for b in $branches; do
            tip=$(gh api "repos/$REPO/git/ref/heads/$b" --jq .object.sha)
            [ "$tip" = "$main_sha" ] && continue

            open=$(gh api "repos/$REPO/pulls?head=$OWNER:$b&state=open" --jq 'length')
            if [ "$open" != "0" ]; then
              echo "$b: open PR exists"
              continue
            fi

            ahead=$(gh api "repos/$REPO/compare/main...$b" --jq .ahead_by)
            if [ "$ahead" = "0" ]; then
              echo "$b: nothing unique, fast-forwarding to main"
              gh api -X PATCH "repos/$REPO/git/refs/heads/$b" -f sha="$main_sha" -F force=true --silent
              continue
            fi

            last=$(gh api "repos/$REPO/pulls?head=$OWNER:$b&state=closed&sort=updated&direction=desc&per_page=1" \
              --jq '.[0] | if . == null then "" else "\(.merged_at // "none") \(.head.sha)" end')
            if [ -n "$last" ]; then
              last_sha=${last#* }
              merged=${last%% *}
              if [ "$last_sha" = "$tip" ]; then
                if [ "$merged" != "none" ]; then
                  echo "$b: merged, resetting to main"
                  gh api -X PATCH "repos/$REPO/git/refs/heads/$b" -f sha="$main_sha" -F force=true --silent
                else
                  echo "$b: PR was closed without merging, leaving as is"
                fi
                continue
              fi
            fi

            user=${b#edits-}
            echo "$b: opening PR"
            gh pr create --repo "$REPO" --base main --head "$b" \
              --title "Content update from $user" \
              --body "Automatic pull request for edits made in Pages CMS on branch \`$b\`. Review the changes, then merge."
          done
